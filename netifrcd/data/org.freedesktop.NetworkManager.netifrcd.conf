<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <!--
      D-Bus system-bus policy for netifrcd.

      netifrcd reimplements the org.freedesktop.NetworkManager D-Bus API, so it
      needs to own exactly the same well-known bus name as NetworkManager itself.

      This file COEXISTS with NetworkManager's own policy, which normally ships as
      /usr/share/dbus-1/system.d/org.freedesktop.NetworkManager.conf. Both files
      are loaded by the system bus; D-Bus merges the rules and the last matching
      rule wins. This file sorts AFTER NetworkManager's own policy
      ("...NetworkManager.conf" < "...NetworkManager.netifrcd.conf"), so the
      grants below take precedence for the netifrcd use case.

      IMPORTANT: only one process can own the name org.freedesktop.NetworkManager
      at a time. If NetworkManager (or its D-Bus activation) is running, netifrcd
      cannot acquire the name and will fail to start. Stop and disable
      NetworkManager first:

          rc-service NetworkManager stop
          rc-update del NetworkManager default

      NetworkManager's policy denies <own> and <send_destination> to
      context="default" and then re-allows individual interfaces; the broad
      send/receive grants in the default block below deliberately override that
      so ordinary users (the Plasma applet) can talk to netifrcd the same way
      they talk to NetworkManager.
    -->

    <policy user="root">
        <!-- netifrcd runs as root and claims the NetworkManager bus name. -->
        <allow own="org.freedesktop.NetworkManager"/>
        <allow send_destination="org.freedesktop.NetworkManager"/>
        <allow receive_sender="org.freedesktop.NetworkManager"/>
    </policy>

    <policy context="default">
        <!-- Any user may talk to and receive signals from netifrcd. Method-level
             authorisation (if any) is handled inside netifrcd itself, mirroring
             how NetworkManager relies on PolicyKit for privileged operations. -->
        <allow send_destination="org.freedesktop.NetworkManager"/>
        <allow receive_sender="org.freedesktop.NetworkManager"/>
    </policy>
</busconfig>
